name: Release images

# Builds and publishes the two deployable container images to GHCR:
#   ghcr.io/<owner>/archimedes-api    → Nebius Serverless Endpoint / Render / any host
#   ghcr.io/<owner>/archimedes-worker → Nebius Serverless Jobs
# The web app deploys to Vercel straight from the repo (see docs/DEPLOYMENT.md).
#
# Triggers: merges to main, version tags (v*), and manual dispatch.
# Images are tagged with the branch/tag name + a short SHA; `latest` follows main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archimedes-api
            context: services/api
            dockerfile: services/api/Dockerfile
          - image: archimedes-worker
            context: services/api
            dockerfile: services/api/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # the api Dockerfile is also the endpoint image; no build args needed
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Verify the image serves /health (api only)
        if: matrix.image == 'archimedes-api'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE:$TAG"
          ID=$(docker run -d -P "$IMAGE:$TAG")
          sleep 5
          PORT=$(docker port "$ID" 8000/tcp | head -1 | cut -d: -f2)
          curl -fsS "http://127.0.0.1:${PORT}/health" | grep -q '"status":"ok"'
          echo "/health OK on the published image"
          docker stop "$ID" >/dev/null
